<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refi Bundle — CNA Capital Improvement Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

:root {
  --maroon: #8D0034;
  --teal: #004751;
  --orange: #F47421;
  --blue: #0088CE;
  --green: #A2B427;
  --gray: #655656;
  --red: #E82C2A;
  --bg: #F7F5F2;
  --surface: #FFFFFF;
  --border: #E4E0DA;
  --text: #1A1410;
  --text-muted: #7A6E6A;
  --text-light: #A89E9A;
  --radius: 10px;
  --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 4px 12px rgba(0,0,0,0.04);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── LAYOUT ── */
.app { display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 280px; min-width: 280px; background: var(--teal); display: flex; flex-direction: column; overflow: hidden; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* ── SIDEBAR ── */
.sidebar-header {
  padding: 20px 18px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.sidebar-logo {
  font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
  color: rgba(255,255,255,0.5); text-transform: uppercase; margin-bottom: 4px;
}
.sidebar-title {
  font-size: 16px; font-weight: 600; color: #fff; line-height: 1.3;
}
.sidebar-sub {
  font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 2px;
}

.sidebar-search {
  padding: 12px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.sidebar-search input {
  width: 100%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px; padding: 7px 10px; color: #fff; font-size: 13px; font-family: inherit;
  outline: none;
}
.sidebar-search input::placeholder { color: rgba(255,255,255,0.4); }
.sidebar-search input:focus { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }

.prop-list { overflow-y: auto; flex: 1; padding: 8px 0; }
.prop-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; cursor: pointer;
  border-left: 3px solid transparent;
  transition: background 0.15s;
}
.prop-item:hover { background: rgba(255,255,255,0.07); }
.prop-item.active {
  background: rgba(255,255,255,0.12);
  border-left-color: var(--orange);
}
.prop-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.prop-info { flex: 1; min-width: 0; }
.prop-name { font-size: 13px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prop-meta { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 1px; }
.prop-badge {
  font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 10px;
  background: rgba(244,116,33,0.25); color: #F47421; flex-shrink: 0;
}
.prop-badge.done { background: rgba(162,180,39,0.25); color: #A2B427; }

.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid rgba(255,255,255,0.1);
  font-size: 11px; color: rgba(255,255,255,0.35);
}

/* ── MAIN HEADER ── */
.main-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex; align-items: flex-start; gap: 20px;
  flex-shrink: 0;
}
.main-header-left { flex: 1; min-width: 0; }
.main-prop-name { font-size: 20px; font-weight: 600; color: var(--text); }
.main-prop-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.main-header-stats { display: flex; gap: 16px; flex-shrink: 0; }
.stat-box { text-align: right; }
.stat-val { font-size: 16px; font-weight: 600; color: var(--text); font-family: 'DM Mono', monospace; }
.stat-lbl { font-size: 11px; color: var(--text-muted); }
.stat-box.imm .stat-val { color: var(--red); }
.stat-box.ten .stat-val { color: var(--maroon); }

/* ── TOOLBAR ── */
.toolbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 24px;
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0; flex-wrap: wrap;
}
.toolbar-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
.filter-btn {
  font-size: 12px; padding: 5px 12px; border-radius: 20px;
  border: 1px solid var(--border); background: transparent;
  cursor: pointer; font-family: inherit; color: var(--text-muted); transition: all 0.15s;
}
.filter-btn:hover { border-color: var(--teal); color: var(--teal); }
.filter-btn.active { background: var(--teal); border-color: var(--teal); color: #fff; }
.toolbar-sep { width: 1px; height: 20px; background: var(--border); }
.progress-wrap { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.progress-bar { width: 120px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--green); border-radius: 3px; transition: width 0.4s; }
.progress-text { font-size: 12px; color: var(--text-muted); font-family: 'DM Mono', monospace; white-space: nowrap; }

/* ── TABLE ── */
.table-wrap { flex: 1; overflow-y: auto; padding: 0 24px 24px; }
.items-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
.items-table th {
  text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--text-muted);
  padding: 8px 12px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--bg); z-index: 2;
}
.items-table td {
  padding: 10px 12px; border-bottom: 1px solid var(--border);
  vertical-align: middle; font-size: 13px;
}
.items-table tr:last-child td { border-bottom: none; }
.items-table tr.completed td { opacity: 0.45; }
.items-table tr.completed .item-desc { text-decoration: line-through; }
.items-table tr:hover td { background: rgba(0,71,81,0.03); }

.check-col { width: 40px; }
.check-wrap { display: flex; align-items: center; justify-content: center; }
.check-btn {
  width: 22px; height: 22px; border-radius: 6px;
  border: 1.5px solid var(--border); background: transparent;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; flex-shrink: 0;
}
.check-btn:hover { border-color: var(--green); }
.check-btn.done { background: var(--green); border-color: var(--green); }
.check-btn.done::after { content: "✓"; color: #fff; font-size: 13px; font-weight: 600; }

.item-desc { color: var(--text); font-weight: 400; line-height: 1.4; max-width: 340px; }
.item-id { font-size: 11px; color: var(--text-muted); font-family: 'DM Mono', monospace; margin-top: 2px; }
.badge-imm {
  display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px;
  border-radius: 10px; background: rgba(232,44,42,0.1); color: var(--red); margin-left: 6px;
}
.year-cell { font-family: 'DM Mono', monospace; font-size: 12px; }
.year-cell.past { color: var(--red); }
.year-cell.near { color: var(--orange); }
.year-cell.future { color: var(--text-muted); }
.cost-cell { font-family: 'DM Mono', monospace; font-size: 12px; text-align: right; }
.rul-cell { font-family: 'DM Mono', monospace; font-size: 12px; text-align: center; }
.done-date { font-size: 11px; color: var(--green); font-style: italic; margin-top: 2px; }
.notes-cell input {
  border: none; background: transparent; font-family: inherit; font-size: 12px;
  color: var(--text-muted); width: 100%; outline: none; cursor: text;
}
.notes-cell input:focus { color: var(--text); }
.notes-cell input::placeholder { color: var(--text-light); }

/* ── EMPTY / LOADING ── */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 200px; color: var(--text-muted); font-size: 14px; gap: 8px;
}
.empty-icon { font-size: 32px; opacity: 0.3; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
</style>
</head>

<div class="app">

<!-- SIDEBAR -->
<nav class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">MEDA · Refi Bundle</div>
    <div class="sidebar-title">CNA Capital Tracker</div>
    <div class="sidebar-sub">15 properties · 2026–2045</div>

</nav>

<!-- MAIN -->
<div class="main">

    <button class="filter-btn" data-filter="done" onclick="setFilter('done')">Completed</button>

    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-text" id="progressText">0 / 0 done</span>
    </div>
  </div>

  <div class="table-wrap">
    <table class="items-table" id="itemsTable">
      <thead>
        <tr>
          <th class="check-col"></th>
          <th>Item / Description</th>
          <th>Planned year</th>
          <th>RUL</th>
          <th style="text-align:right">Replacement cost</th>
          <th>Notes</th>

      </thead>
      <tbody id="itemsBody">
        <tr><td colspan="6"><div class="empty-state"><span class="empty-icon">🏘</span>Select a property to begin</div></td></tr>
      </tbody>
    </table>
  </div>
</div>
</div>

<script>
const STORAGE_KEY = 'meda_cna_tracker_v1';
let state = { completions: {}, notes: {} }; // key: `${prop}::${itemIdx}` => {done, doneDate, note}
let currentProp = null;
let currentFilter = 'all';

function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) state = JSON.parse(s);
  } catch(e) {}
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function stateKey(prop, idx) { return prop + '::' + idx; }

function isComplete(prop, idx) {
  return !!(state.completions[stateKey(prop, idx)]);
}

function getNote(prop, idx) {
  return state.notes[stateKey(prop, idx)] || '';
}

function toggleItem(prop, idx) {
  const k = stateKey(prop, idx);
  if (state.completions[k]) {
    delete state.completions[k];
  } else {
    state.completions[k] = new Date().toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'});
  }
  saveState();
  renderItems();
  renderSidebar();
}

function saveNote(prop, idx, val) {
  const k = stateKey(prop, idx);
  if (val) state.notes[k] = val;
  else delete state.notes[k];
  saveState();
}

function fmt(n) { return n ? '$' + Math.round(n).toLocaleString() : '—'; }

function propProgress(propName) {
  const items = CNA_DATA[propName].items;
  const total = items.length;
  const done = items.filter((_,i) => isComplete(propName, i)).length;
  return { done, total };
}

function urgencyColor(imm_total) {
  if (imm_total > 200000) return '#E82C2A';
  if (imm_total > 80000) return '#F47421';
  return '#A2B427';
}

function renderSidebar() {
  const search = document.getElementById('propSearch').value.toLowerCase();
  const props = Object.keys(CNA_DATA).filter(p => p.toLowerCase().includes(search));
  const totalDone = Object.keys(CNA_DATA).reduce((s,p)=>s+propProgress(p).done,0);
  const totalItems = Object.keys(CNA_DATA).reduce((s,p)=>s+propProgress(p).total,0);
  document.getElementById('globalSummary').textContent = totalDone + ' of ' + totalItems + ' items completed across all properties';

  document.getElementById('propList').innerHTML = props.map(p => {
    const d = CNA_DATA[p];
    const {done, total} = propProgress(p);
    const color = urgencyColor(d.imm_total);
    const pct = total ? Math.round(done/total*100) : 0;
    return `<div class="prop-item${currentProp===p?' active':''}" onclick="selectProp('${p.replace(/'/g,"\'")}')">
      <div class="prop-dot" style="background:${color}"></div>
      <div class="prop-info">
        <div class="prop-name">${p}</div>
        <div class="prop-meta">${fmt(d.imm_total)} immediate · ${total} items</div>
      </div>
      <div class="prop-badge${pct===100?' done':''}">${pct}%</div>
    </div>`;
  }).join('');
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter===f));
  renderItems();
}

function selectProp(name) {
  currentProp = name;
  renderSidebar();
  const d = CNA_DATA[name];
  document.getElementById('propTitle').textContent = name;
  document.getElementById('propSub').textContent = d.items.length + ' capital improvement items · ' + d.items.filter(x=>x.is_immediate).length + ' immediate needs';
  document.getElementById('headerStats').innerHTML = `
    <div class="stat-box imm"><div class="stat-val">${fmt(d.imm_total)}</div><div class="stat-lbl">Immediate needs</div></div>
    <div class="stat-box ten"><div class="stat-val">${fmt(d.ten_yr)}</div><div class="stat-lbl">10-yr inflated</div></div>
    <div class="stat-box"><div class="stat-val">${fmt(d.twenty_yr)}</div><div class="stat-lbl">20-yr total</div></div>
  `;
  renderItems();
}

function renderItems() {
  if (!currentProp) return;
  const items = CNA_DATA[currentProp].items;
  const {done, total} = propProgress(currentProp);
  document.getElementById('progressFill').style.width = (total ? done/total*100 : 0) + '%';
  document.getElementById('progressText').textContent = done + ' / ' + total + ' completed';

  const now = new Date().getFullYear();
  const filtered = items.map((item, i) => ({item, i})).filter(({item, i}) => {
    if (currentFilter === 'immediate') return item.is_immediate;
    if (currentFilter === 'done') return isComplete(currentProp, i);
    if (currentFilter === 'pending') return !isComplete(currentProp, i);
    return true;
  });

  if (!filtered.length) {
    document.getElementById('itemsBody').innerHTML = '<tr><td colspan="6"><div class="empty-state"><span class="empty-icon">✓</span>No items match this filter</div></td></tr>';
    return;
  }

  document.getElementById('itemsBody').innerHTML = filtered.map(({item, i}) => {
    const done = isComplete(currentProp, i);
    const doneDate = state.completions[stateKey(currentProp, i)] || '';
    const note = getNote(currentProp, i);
    let yrClass = 'future';
    if (item.planned_year && item.planned_year <= now) yrClass = 'past';
    else if (item.planned_year && item.planned_year <= now + 3) yrClass = 'near';
    return `<tr class="${done?'completed':''}">
      <td class="check-col"><div class="check-wrap"><button class="check-btn${done?' done':''}" onclick="toggleItem('${currentProp.replace(/'/g,"\'")}',${i})" title="${done?'Mark incomplete':'Mark complete'}"></button></div></td>
      <td>
        <div class="item-desc">${item.description}${item.is_immediate?'<span class="badge-imm">IMMEDIATE</span>':''}</div>
        <div class="item-id">${item.id}</div>
        ${done&&doneDate?`<div class="done-date">Completed ${doneDate}</div>`:''}
      </td>
      <td class="year-cell ${yrClass}">${item.planned_year||'—'}</td>
      <td class="rul-cell">${item.rul!==null&&item.rul!==undefined?item.rul:'—'}</td>
      <td class="cost-cell">${fmt(item.replacement_cost)}</td>
      <td class="notes-cell"><input type="text" placeholder="Add note…" value="${note.replace(/"/g,'&quot;')}" onchange="saveNote('${currentProp.replace(/'/g,"\'")}',${i},this.value)" onblur="saveNote('${currentProp.replace(/'/g,"\'")}',${i},this.value)"></td>
    </tr>`;
  }).join('');
}

// Init
loadState();
renderSidebar();
document.getElementById('propSearch').addEventListener('input', renderSidebar);
// Auto-select first property
const firstProp = Object.keys(CNA_DATA)[0];
if (firstProp) selectProp(firstProp);
</script>
</body>
</html>
