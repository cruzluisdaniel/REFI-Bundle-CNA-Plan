<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEDA Refi Bundle — CNA Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap');
:root{
  --maroon:#8D0034;--teal:#004751;--orange:#F47421;--blue:#0088CE;
  --green:#A2B427;--gray:#655656;--red:#E82C2A;
  --bg:#F4F2EE;--surface:#FFFFFF;--border:#E2DDD8;
  --text:#18130F;--muted:#7B6E69;--light:#AFA8A4;
  --r:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.13);border-radius:3px}

/* ─── TOP BAR ─── */
.topbar{background:var(--teal);color:#fff;padding:12px 28px;display:flex;align-items:center;gap:16px}
.topbar-logo{font-size:11px;font-weight:600;letter-spacing:.1em;opacity:.6;text-transform:uppercase}
.topbar-title{font-size:15px;font-weight:600}
.topbar-sub{font-size:12px;opacity:.5;margin-left:auto}

/* ─── DASHBOARD STRIP ─── */
.dash{background:var(--surface);border-bottom:1px solid var(--border);padding:20px 28px;display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.dash-section{display:flex;flex-direction:column;gap:6px}
.dash-section-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-bottom:2px;border-bottom:2px solid var(--border)}
.dash-cards{display:flex;gap:10px;flex-wrap:wrap}
.dcard{background:var(--bg);border-radius:8px;padding:10px 16px;min-width:130px}
.dcard-val{font-size:19px;font-weight:600;font-family:'DM Mono',monospace;line-height:1}
.dcard-lbl{font-size:11px;color:var(--muted);margin-top:3px}
.dcard.red .dcard-val{color:var(--red)}
.dcard.orange .dcard-val{color:var(--orange)}
.dcard.maroon .dcard-val{color:var(--maroon)}
.dcard.teal .dcard-val{color:var(--teal)}
.dcard.green .dcard-val{color:var(--green)}
.dash-divider{width:1px;background:var(--border);align-self:stretch;margin:0 4px}

/* progress bar for completed */
.dcard-progress{margin-top:8px}
.pbar{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.pbar-fill{height:100%;border-radius:3px;background:var(--green);transition:width .4s}
.pbar-txt{font-size:10px;color:var(--muted);margin-top:3px;font-family:'DM Mono',monospace}

/* year mini chart */
.year-mini{display:flex;align-items:flex-end;gap:3px;height:40px;margin-top:4px}
.ybar-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:default}
.ybar{width:22px;border-radius:3px 3px 0 0;background:var(--teal);opacity:.7;min-height:2px;transition:opacity .2s}
.ybar:hover{opacity:1}
.ybar.done{background:var(--green)}
.ybar.imm{background:var(--red)}
.ybar-yr{font-size:9px;color:var(--muted);font-family:'DM Mono',monospace}

/* ─── CONTROLS ─── */
.controls{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 28px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctrl-group{display:flex;align-items:center;gap:6px}
.ctrl-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
select,input[type=text]{font-family:'DM Sans',sans-serif;font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);outline:none;cursor:pointer}
select:focus,input[type=text]:focus{border-color:var(--teal)}
.pill-group{display:flex;gap:4px;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 11px;border-radius:20px;border:1px solid var(--border);background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--muted);transition:all .15s;white-space:nowrap}
.pill:hover{border-color:var(--teal);color:var(--teal)}
.pill.on{background:var(--teal);border-color:var(--teal);color:#fff}
.ctrl-sep{width:1px;height:22px;background:var(--border)}
.sort-btn{font-size:11px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;font-family:inherit;color:var(--muted)}
.sort-btn.on{border-color:var(--teal);color:var(--teal)}
.results-count{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}

/* ─── TABLE ─── */
.table-wrap{overflow:auto;flex:1}
.data-table{width:100%;border-collapse:collapse;min-width:900px}
.data-table thead th{
  position:sticky;top:0;z-index:3;background:var(--bg);
  font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--border);
  text-align:left;white-space:nowrap;cursor:pointer;user-select:none
}
.data-table thead th:hover{color:var(--teal)}
.data-table thead th.sorted{color:var(--teal)}
.data-table thead th .sort-arrow{font-size:10px;margin-left:3px;opacity:.6}
.data-table td{padding:9px 12px;border-bottom:.5px solid var(--border);vertical-align:middle;font-size:13px}
.data-table tr:last-child td{border-bottom:none}
.data-table tr.done-row td{opacity:.4}
.data-table tr.done-row .item-desc{text-decoration:line-through}
.data-table tr:hover td{background:rgba(0,71,81,.03)}
.check-btn{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.check-btn:hover{border-color:var(--green)}
.check-btn.on{background:var(--green);border-color:var(--green)}
.check-btn.on::after{content:"✓";color:#fff;font-size:13px;font-weight:700}
.prop-tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;background:rgba(0,71,81,.1);color:var(--teal);white-space:nowrap;margin-bottom:3px}
.item-desc{color:var(--text);line-height:1.35;max-width:320px}
.item-id{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:1px}
.badge-imm{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;background:rgba(232,44,42,.12);color:var(--red);margin-left:5px;letter-spacing:.04em}
.mono{font-family:'DM Mono',monospace;font-size:12px}
.yr-past{color:var(--red)}
.yr-near{color:var(--orange)}
.yr-ok{color:var(--muted)}
.done-date{font-size:10px;color:var(--green);font-style:italic;margin-top:2px}
.note-input{border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--muted);width:100%;outline:none;min-width:120px}
.note-input:focus{color:var(--text)}
.note-input::placeholder{color:var(--light)}
.cost-col{text-align:right}
.rul-col{text-align:center}
.empty{text-align:center;padding:48px;color:var(--muted);font-size:14px}

/* ─── LAYOUT SHELL ─── */
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.body-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
</style>
</head>
<body>
<div class="shell">

<!-- TOP BAR -->
<div class="topbar">
  <span class="topbar-logo">MEDA · Refi Bundle</span>
  <span class="topbar-title">CNA Capital Improvement Tracker</span>
  <span class="topbar-sub">15 properties · 2026–2045 · data saved in browser</span>
</div>

<!-- DASHBOARD STRIP -->
<div class="dash" id="dash"></div>

<!-- CONTROLS -->
<div class="controls">
  <div class="ctrl-group">
    <span class="ctrl-label">Property</span>
    <select id="propSelect"><option value="">All properties</option></select>
  </div>
  <div class="ctrl-sep"></div>
  <div class="ctrl-group">
    <span class="ctrl-label">Year range</span>
    <select id="yearFrom"></select>
    <span style="font-size:12px;color:var(--muted)">to</span>
    <select id="yearTo"></select>
  </div>
  <div class="ctrl-sep"></div>
  <div class="ctrl-group">
    <span class="ctrl-label">Status</span>
    <div class="pill-group">
      <button class="pill on" data-f="all" onclick="setFilter('all')">All</button>
      <button class="pill" data-f="immediate" onclick="setFilter('immediate')">Immediate</button>
      <button class="pill" data-f="pending" onclick="setFilter('pending')">Pending</button>
      <button class="pill" data-f="done" onclick="setFilter('done')">Completed</button>
    </div>
  </div>
  <div class="ctrl-sep"></div>
  <div class="ctrl-group">
    <span class="ctrl-label">Item type</span>
    <select id="itemTypeSelect"><option value="">All item types</option></select>
  </div>
  <div class="ctrl-sep"></div>
  <div class="ctrl-group">
    <span class="ctrl-label">Sort</span>
    <select id="sortSelect">
      <option value="year_asc">Year ↑</option>
      <option value="year_desc">Year ↓</option>
      <option value="cost_desc">Cost ↓</option>
      <option value="cost_asc">Cost ↑</option>
      <option value="imm_desc">Immediate ↓</option>
      <option value="prop_asc">Property A→Z</option>
    </select>
  </div>
  <span class="results-count" id="resultsCount"></span>
</div>

<!-- TABLE -->
<div class="body-area">
  <div class="table-wrap">
    <table class="data-table" id="mainTable">
      <thead>
        <tr>
          <th style="width:40px"></th>
          <th>Property</th>
          <th>Item / Description</th>
          <th data-col="planned_year">Planned year <span class="sort-arrow">↕</span></th>
          <th class="rul-col" data-col="rul">RUL <span class="sort-arrow">↕</span></th>
          <th class="cost-col" data-col="replacement_cost">Replacement cost <span class="sort-arrow">↕</span></th>
          <th class="cost-col" data-col="immediate_needs">Immediate needs <span class="sort-arrow">↕</span></th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

</div>

<script>
const STORAGE_KEY = 'meda_cna_v2';
let state = {completions:{}, notes:{}};
let filterStatus = 'all';
let sortKey = 'year_asc';

function loadState(){try{const s=localStorage.getItem(STORAGE_KEY);if(s)state=JSON.parse(s);}catch(e){}}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}
function sk(prop,idx){return prop+'::'+idx}
function isDone(prop,idx){return !!state.completions[sk(prop,idx)]}
function getDoneDate(prop,idx){return state.completions[sk(prop,idx)]||''}
function getNote(prop,idx){return state.notes[sk(prop,idx)]||''}

// ─── BUILD FLAT DATA ───
const FLAT = [];
for(const [prop, pd] of Object.entries(CNA_DATA)){
  pd.items.forEach((item,i)=>{
    FLAT.push({...item, property:prop, prop_idx:i});
  });
}
const ALL_PROPS = Object.keys(CNA_DATA);
const ALL_YEARS = [...new Set(FLAT.map(x=>x.planned_year).filter(Boolean))].sort();
const ALL_ITEM_TYPES = [...new Set(FLAT.map(x=>x.id).filter(Boolean))].sort();
const MIN_YEAR = Math.min(...ALL_YEARS);
const MAX_YEAR = Math.max(...ALL_YEARS);

// ─── POPULATE DROPDOWNS ───
function populateDropdowns(){
  const ps = document.getElementById('propSelect');
  ALL_PROPS.forEach(p=>{
    const o=document.createElement('option');o.value=p;o.textContent=p;ps.appendChild(o);
  });
  const yf=document.getElementById('yearFrom');
  const yt=document.getElementById('yearTo');
  for(let y=2026;y<=2045;y++){
    [yf,yt].forEach(sel=>{const o=document.createElement('option');o.value=y;o.textContent=y;sel.appendChild(o);});
  }
  yf.value=2026; yt.value=2031;
  const its=document.getElementById('itemTypeSelect');
  ALL_ITEM_TYPES.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;its.appendChild(o);});
}

// ─── DASHBOARD ───
function renderDash(){
  const totalImm = FLAT.reduce((s,x)=>s+x.immediate_needs,0);
  const doneImm = FLAT.filter(x=>isDone(x.property,x.prop_idx)&&x.immediate_needs>0).reduce((s,x)=>s+x.immediate_needs,0);
  const pctImm = totalImm>0?Math.round(doneImm/totalImm*100):0;

  const yr5Items = FLAT.filter(x=>x.planned_year&&x.planned_year>=2026&&x.planned_year<=2030);
  const yr5Total = yr5Items.reduce((s,x)=>s+x.replacement_cost,0);
  const yr5Done = yr5Items.filter(x=>isDone(x.property,x.prop_idx)).reduce((s,x)=>s+x.replacement_cost,0);
  const pctYr5 = yr5Total>0?Math.round(yr5Done/yr5Total*100):0;
  const yr5DoneCount = yr5Items.filter(x=>isDone(x.property,x.prop_idx)).length;

  const totalDone = FLAT.filter(x=>isDone(x.property,x.prop_idx)).length;
  const totalAll = FLAT.length;
  const pctAll = Math.round(totalDone/totalAll*100);

  // Year bars 2026-2031
  const yrData = {};
  for(let y=2026;y<=2031;y++){
    const items = FLAT.filter(x=>x.planned_year===y);
    const total = items.reduce((s,x)=>s+x.replacement_cost,0);
    const done = items.filter(x=>isDone(x.property,x.prop_idx)).reduce((s,x)=>s+x.replacement_cost,0);
    yrData[y]={total,done,count:items.length};
  }
  const maxYrVal = Math.max(...Object.values(yrData).map(d=>d.total),1);

  const fmt=n=>n>=1000000?'$'+(n/1000000).toFixed(1)+'M':n>=1000?'$'+Math.round(n/1000)+'K':'$'+Math.round(n).toLocaleString();
  const fmtFull=n=>'$'+Math.round(n).toLocaleString();

  document.getElementById('dash').innerHTML = `
  <div class="dash-section">
    <div class="dash-section-label">Immediate needs — all properties</div>
    <div class="dash-cards">
      <div class="dcard red"><div class="dcard-val">${fmt(totalImm)}</div><div class="dcard-lbl">Total immediate needs</div>
        <div class="dcard-progress"><div class="pbar"><div class="pbar-fill" style="width:${pctImm}%"></div></div>
        <div class="pbar-txt">${fmt(doneImm)} completed (${pctImm}%)</div></div>
      </div>
      <div class="dcard orange"><div class="dcard-val">${fmt(totalImm-doneImm)}</div><div class="dcard-lbl">Remaining immediate needs</div></div>
      <div class="dcard green"><div class="dcard-val">${fmt(doneImm)}</div><div class="dcard-lbl">Immediate needs completed</div></div>
    </div>
  </div>
  <div class="dash-divider"></div>
  <div class="dash-section">
    <div class="dash-section-label">Year 1–5 outlook (2026–2030)</div>
    <div class="dash-cards">
      <div class="dcard maroon"><div class="dcard-val">${fmt(yr5Total)}</div><div class="dcard-lbl">Total planned (yr 1–5)</div>
        <div class="dcard-progress"><div class="pbar"><div class="pbar-fill" style="width:${pctYr5}%"></div></div>
        <div class="pbar-txt">${yr5DoneCount} of ${yr5Items.length} items done (${pctYr5}%)</div></div>
      </div>
      ${[2026,2027,2028,2029,2030,2031].map(y=>{
        const d=yrData[y];
        const h=d.total>0?Math.round((d.total/maxYrVal)*38)+2:2;
        const dh=d.done>0?Math.round((d.done/maxYrVal)*38)+2:0;
        return `<div class="dcard teal" style="min-width:80px;padding:8px 10px">
          <div class="year-mini">
            <div class="ybar-wrap" title="${y}: ${fmtFull(d.total)} total, ${fmtFull(d.done)} done, ${d.count} items">
              <div style="position:relative;width:22px;height:40px;display:flex;align-items:flex-end">
                <div class="ybar" style="width:22px;height:${h}px;position:absolute;bottom:0;opacity:.3"></div>
                ${dh>0?`<div class="ybar done" style="width:22px;height:${dh}px;position:absolute;bottom:0;opacity:.9"></div>`:''}
              </div>
            </div>
          </div>
          <div class="dcard-val" style="font-size:14px;margin-top:4px">${fmt(d.total)}</div>
          <div class="dcard-lbl">${y} · ${d.count} items</div>
        </div>`;
      }).join('')}
    </div>
  </div>
  <div class="dash-divider"></div>
  <div class="dash-section">
    <div class="dash-section-label">Overall progress</div>
    <div class="dash-cards">
      <div class="dcard"><div class="dcard-val">${totalDone}<span style="font-size:14px;color:var(--muted)"> / ${totalAll}</span></div><div class="dcard-lbl">Items completed</div>
        <div class="dcard-progress"><div class="pbar"><div class="pbar-fill" style="width:${pctAll}%"></div></div>
        <div class="pbar-txt">${pctAll}% complete across all properties</div></div>
      </div>
    </div>
  </div>`;
}

// ─── TABLE ───
function setFilter(f){
  filterStatus=f;
  document.querySelectorAll('.pill').forEach(b=>b.classList.toggle('on',b.dataset.f===f));
  renderTable();
}

function getFiltered(){
  const prop = document.getElementById('propSelect').value;
  const yFrom = parseInt(document.getElementById('yearFrom').value)||2026;
  const yTo = parseInt(document.getElementById('yearTo').value)||2031;
  const itemType = document.getElementById('itemTypeSelect').value;
  const sort = document.getElementById('sortSelect').value;

  let rows = FLAT.filter(x=>{
    if(prop && x.property!==prop) return false;
    if(itemType && x.id!==itemType) return false;
    if(filterStatus==='immediate' && !x.is_immediate) return false;
    if(filterStatus==='done' && !isDone(x.property,x.prop_idx)) return false;
    if(filterStatus==='pending' && isDone(x.property,x.prop_idx)) return false;
    // Year filter: include items with planned_year in range, OR items with no year but is_immediate
    const inRange = x.planned_year && x.planned_year>=yFrom && x.planned_year<=yTo;
    const immNoYear = x.is_immediate && !x.planned_year;
    if(!inRange && !immNoYear) return false;
    return true;
  });

  const dir = sort.endsWith('_desc')?-1:1;
  const field = sort.replace('_asc','').replace('_desc','');
  rows.sort((a,b)=>{
    let av,bv;
    if(field==='year'){av=a.planned_year||9999;bv=b.planned_year||9999;}
    else if(field==='cost'){av=a.replacement_cost;bv=b.replacement_cost;}
    else if(field==='imm'){av=a.immediate_needs;bv=b.immediate_needs;}
    else if(field==='prop'){av=a.property;bv=b.property;return dir*(av<bv?-1:av>bv?1:0);}
    else{av=a.planned_year||9999;bv=b.planned_year||9999;}
    return dir*(av-bv);
  });
  return rows;
}

function renderTable(){
  const rows = getFiltered();
  const now = new Date().getFullYear();
  document.getElementById('resultsCount').textContent = rows.length.toLocaleString() + ' items';

  const fmt=n=>n?'$'+Math.round(n).toLocaleString():'—';

  if(!rows.length){
    document.getElementById('tableBody').innerHTML=`<tr><td colspan="8" class="empty">No items match the current filters</td></tr>`;
    return;
  }

  document.getElementById('tableBody').innerHTML = rows.map(x=>{
    const done=isDone(x.property,x.prop_idx);
    const doneDate=getDoneDate(x.property,x.prop_idx);
    const note=getNote(x.property,x.prop_idx);
    let yrCls='yr-ok';
    if(x.planned_year&&x.planned_year<=now)yrCls='yr-past';
    else if(x.planned_year&&x.planned_year<=now+2)yrCls='yr-near';
    const propSafe=x.property.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return `<tr class="${done?'done-row':''}">
      <td><div class="check-wrap" style="display:flex;align-items:center;justify-content:center">
        <button class="check-btn${done?' on':''}" onclick="toggleItem('${propSafe}',${x.prop_idx})" title="${done?'Mark incomplete':'Mark complete'}"></button>
      </div></td>
      <td><div class="prop-tag">${x.property}</div></td>
      <td><div class="item-desc">${x.description}${x.is_immediate?'<span class="badge-imm">IMMEDIATE</span>':''}</div>
          <div class="item-id">${x.id}</div>
          ${done&&doneDate?`<div class="done-date">✓ Completed ${doneDate}</div>`:''}
      </td>
      <td class="mono ${yrCls}">${x.planned_year||'—'}</td>
      <td class="mono rul-col">${x.rul!==null&&x.rul!==undefined?x.rul:'—'}</td>
      <td class="mono cost-col">${fmt(x.replacement_cost)}</td>
      <td class="mono cost-col" style="${x.immediate_needs>0?'color:var(--red);font-weight:500':''}">${x.immediate_needs>0?fmt(x.immediate_needs):'—'}</td>
      <td><input class="note-input" placeholder="Add note…" value="${note.replace(/"/g,'&quot;')}"
          onchange="saveNote('${propSafe}',${x.prop_idx},this.value)"
          onblur="saveNote('${propSafe}',${x.prop_idx},this.value)"></td>
    </tr>`;
  }).join('');
}

function toggleItem(prop,idx){
  const k=sk(prop,idx);
  if(state.completions[k]){delete state.completions[k];}
  else{state.completions[k]=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
  saveState();
  renderDash();
  renderTable();
}

function saveNote(prop,idx,val){
  const k=sk(prop,idx);
  if(val)state.notes[k]=val;else delete state.notes[k];
  saveState();
}

// ─── EVENTS ───
['propSelect','yearFrom','yearTo','itemTypeSelect','sortSelect'].forEach(id=>{
  document.getElementById(id).addEventListener('change',renderTable);
});

// Sync year range order
document.getElementById('yearFrom').addEventListener('change',function(){
  const yf=parseInt(this.value), yt=parseInt(document.getElementById('yearTo').value);
  if(yf>yt)document.getElementById('yearTo').value=yf;
  renderTable();
});
document.getElementById('yearTo').addEventListener('change',function(){
  const yt=parseInt(this.value), yf=parseInt(document.getElementById('yearFrom').value);
  if(yt<yf)document.getElementById('yearFrom').value=yt;
  renderTable();
});

// ─── INIT ───
loadState();
populateDropdowns();
renderDash();
renderTable();
</script>
</body>
</html>
